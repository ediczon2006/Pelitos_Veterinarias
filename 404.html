<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada | Pelitos Veterinaria &amp; Estética</title>
  <meta name="description" content="La página solicitada no se encontró en Pelitos Veterinaria (Huánuco, Perú). Regresa al inicio o contáctanos por WhatsApp." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="images/logo/favicon.png" data-rel-asset />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" />
  <link rel="stylesheet" href="css/styles.css" data-rel-asset />
  <link rel="stylesheet" href="css/editorial.css" data-rel-asset />
  <link rel="stylesheet" href="css/neofuturismo.css" data-rel-asset />
  <link rel="stylesheet" href="css/correcciones.css" data-rel-asset />
  <script>
    // Ajusta rutas relativas si el error 404 ocurre dentro de /pages/...
    (function () {
      if (/\/pages\//i.test(window.location.pathname)) {
        document.querySelectorAll("[data-rel-asset]").forEach(function (el) {
          var href = el.getAttribute("href");
          if (href && !href.startsWith("../") && !href.startsWith("http")) {
            el.setAttribute("href", "../" + href);
          }
        });
      }
    })();
  </script>
  <style>
    .error-404-hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      background: linear-gradient(180deg, #faf7f2 0%, #f4eee2 100%);
    }
    .error-card {
      max-width: 580px;
      width: 100%;
      background: #ffffff;
      padding: 3rem 2.25rem;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(109, 53, 138, 0.08);
      border: 1px solid rgba(240, 137, 42, 0.2);
    }
    .error-code {
      font-size: clamp(4rem, 12vw, 5.5rem);
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #6d358a 0%, #f0892a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2e1e36;
      margin: 1rem 0 0.5rem;
    }
    .error-desc {
      color: #574d60;
      font-size: 1.02rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-pelitos-primary {
      background: linear-gradient(135deg, #6d358a 0%, #8543a7 100%);
      color: #ffffff !important;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(109, 53, 138, 0.3);
    }
    .btn-pelitos-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(109, 53, 138, 0.4);
    }
    .btn-pelitos-secondary {
      background: #faf4ea;
      color: #9a4f06 !important;
      border: 1.5px solid #f0892a;
      padding: 0.85rem 1.75rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-pelitos-secondary:hover {
      background: #fdecd2;
      transform: translateY(-2px);
    }
    .btn-pelitos-primary:focus-visible,
    .btn-pelitos-secondary:focus-visible {
      outline: 3px solid #7c3aed;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="error-404-hero" id="contenido">
    <div class="error-card">
      <div style="font-size: 3.5rem; margin-bottom: 0.5rem;" aria-hidden="true">🐾</div>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">¡Ups! Esta patita se desvió del camino</h2>
      <p class="error-desc">
        La página que buscas no existe o ha sido movida. Pero no te preocupes, nuestros especialistas y consentidos te esperan en la clínica.
      </p>
      <div class="error-actions">
        <a href="index.html" class="btn-pelitos-primary" id="link-volver-inicio">Volver al Inicio</a>
        <a href="https://api.whatsapp.com/send?phone=51939356376&amp;text=Hola%20Pelitos%20Veterinaria%2C%20necesito%20informaci%C3%B3n." target="_blank" rel="noopener noreferrer" class="btn-pelitos-secondary">Escribir por WhatsApp</a>
      </div>
    </div>
  </main>
  <script>
    if (/\/pages\//i.test(window.location.pathname)) {
      var inicio = document.getElementById("link-volver-inicio");
      if (inicio) inicio.setAttribute("href", "../index.html");
    }
  </script>
</body>
</html>
