# ==============================================================================
# Pelitos Veterinaria & Estética — Configuración de Despliegue Netlify
# ==============================================================================

[build]
  publish = "."

# Redirección SPA / Páginas no encontradas (404 personalizado)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ─── Cabeceras de Seguridad Zero-Trust (OWASP Compliance) ─────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Protección contra clickjacking y embebido no autorizado
    X-Frame-Options = "SAMEORIGIN"
    # Prevención estricta de MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Referrer policy para mitigar fuga de datos en URLs
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Política de permisos de APIs del navegador
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Forzar transporte TLS 1.3/HTTPS con HSTS por 1 año y preload
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy (CSP) nivel de contención
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com https://api.fontshare.com; img-src 'self' data: https: blob:; connect-src 'self' https://generativelanguage.googleapis.com https://*.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://api.whatsapp.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://api.whatsapp.com;"

# ─── Políticas de Caché y Rendimiento (Core Web Vitals) ───────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
